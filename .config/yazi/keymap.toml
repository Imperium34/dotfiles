[mgr]
prepend_keymap = [
    # Force Enter to go INSIDE directory
    { on = [ "<Enter>" ], run = "enter", desc = "Enter directory" },
    # Force Right Arrow to go INSIDE directory
    { on = [ "<Right>" ], run = "enter", desc = "Enter directory" },
    
    # Keep 'l' as enter too if you want vim-keys
    { on = [ "l" ], run = "enter", desc = "Enter directory" }
]
