# $hyprDir = $HOME/.config/hypr
source = ~/.config/hypr/hypr-colors.conf
$layout_x = -630

# BACKGROUND
background {
    monitor =
    path = ~/Pictures/current-dark.png
}

# GENERAL
general {
    hide_cursor = true
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $color7
    font_size = 65
    font_family = Departure Mono
    position = $layout_x, 300
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:60000] date +"%d %B %Y"
    color = $color7
    font_size = 30
    text_align = left
    font_family = Departure Mono
    position = $layout_x, 230
    halign = center
    valign = center
}

#Quote
label {
    monitor =
    text = cmd[update:24000000] ~/.config/hypr/scripts/quote.sh
    color = $color7
    font_size = 18
    font_family = Departure Mono
    position = 0, 80
    halign = center
    valign = bottom
}

# Battery Pill Background
shape {
    monitor =
    size = 180, 50
    color = $surfaceAlpha
    rounding = -1
    border_size = 0
    border_color = $background
    
    position = $layout_x, -280
    halign = center
    valign = center
}

#Battery
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/battery.sh
    
    color = $foreground
    font_size = 18
    font_family = Departure Mono
    
    position = $layout_x, -280
    halign = center
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = ~/Pictures/ProfilePhoto.png
    border_size = 1
    border_color = $background
    size = 160
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = $layout_x, 0
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = $surfaceAlpha
    rounding = -1
    border_size = 0
    border_color = $background
    rotate = 0
    xray = false

    position = $layout_x, -120
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =  $USER
    color = $foreground
    font_size = 16
    font_family = Departure Mono
    position = $layout_x, -120
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = $surfaceAlpha
    font_color = $foreground
    fade_on_empty = false
    font_family = Departure Mono
    placeholder_text = <i>🔒 Password</i>
    hide_input = false
    position = $layout_x, -200
    halign = center
    valign = center
}

#fingerprint
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250
    }
}


#Song Box
shape {
    monitor =
    size = 500, 540
    color = $surfaceAlpha
    rounding = 30
    border_size = 1
    border_color = rgba(255, 255, 255, 0)
    position = -145, 0     
    halign = right
    valign = center
}

#Album Art
image {
    monitor =
    path = /tmp/cover.png
    size = 350
    rounding = 20
    border_size = 0
    reload_time = 1
    reload_cmd = echo /tmp/cover.png
    position = -220, 75
    halign = right
    valign = center
}

#Song Title
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/media-player.py --title
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = Departure Mono Bold
    text_align = center

    position = -158, -125
    halign = right
    valign = center
    
    shadow_passes = 1
}

#Song Artist
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/media-player.py --artist
    color = rgba(255, 255, 255, 0.7)
    font_size = 15
    font_family = Departure Mono
    
    position = -175, -175
    halign = right
    valign = center
}

#Song Bar
label {
    monitor =
    text = cmd[update:1500] ~/.config/hypr/scripts/media-player.py --bar
    color = rgb(255, 255, 255)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    
    position = -175, -225
    halign = right
    valign = center
}
