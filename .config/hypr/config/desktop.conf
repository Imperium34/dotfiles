# -----------------------------------------------------
# 🎨 VISUALS & LAYOUT (Desktop "Eye Candy")
# -----------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    
    border_size = 3
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
}

# -----------------------------------------------------
# 🎬 ANIMATIONS (Smooth & Fluid)
# -----------------------------------------------------
animations {
    enabled = yes

    # A smoother bezier curve (not just "fast")
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    # Slower durations (e.g., 7) for a premium feel
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# -----------------------------------------------------
# ⚙️ MISC
# -----------------------------------------------------
misc {
    vfr = true
    vrr = 1 
    
    force_default_wallpaper = 0
}

# -----------------------------------------------------
# ⌨️ INPUT
# -----------------------------------------------------
input {
    follow_mouse = 2 
    float_switch_override_focus = 2
    
    kb_layout = en
    kb_options = grp:alt_shift_toggle
    
    # sensitivity = 0 
}

# -----------------------------------------------------
# 🎮 GPU SPECIFIC ENV (Uncomment YOUR GPU)
# -----------------------------------------------------

# --- NVIDIA ---
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# cursor {
#     no_hardware_cursors = true
# }

# --- AMD ---
# (Usually doesn't need specific ENV vars on Hyprland, works OOB)
# env = LIBVA_DRIVER_NAME,radeonsi 
# env = VDPAU_DRIVER,radeonsi

# --- INTEL (Desktop) ---
# env = LIBVA_DRIVER_NAME,iHD
# env = __GLX_VENDOR_LIBRARY_NAME,iHD
