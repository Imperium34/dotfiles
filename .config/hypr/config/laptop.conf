exec-once = ~/.config/hypr/scripts/auto-blur.sh

general {
    gaps_in = 3
    gaps_out = 5
    
    border_size = 2
}

decoration {
    rounding = 5
}

decoration {
	blur{
	enabled = false
	}
}

animations {
    enabled = yes

    bezier = fastEase, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 3, fastEase
    animation = windowsOut, 1, 3, fastEase, popin 80%
    
    animation = border, 1, 2, default
    
    animation = fade, 1, 3, default

    animation = workspaces, 1, 3, fastEase
}

misc {
    vfr = true
    
    force_default_wallpaper = 0
}

input {
    follow_mouse = 2 # 0|1|2|3
    float_switch_override_focus = 2
    kb_layout = tr
    kb_options = grp:alt_shift_toggle
}

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Gestures                                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# 4-finger horizontal swipe to switch workspaces
gesture = 4, horizontal, workspace

# 3-finger swipe down closes active window
gesture = 3, down, close

# 3-finger swipe up toggles fullscreen
gesture = 3, up, fullscreen

# 3-finger swipe left toggles float/tile
gesture = 3, left, float

env = LIBVA_DRIVER_NAME,iHD
env = __GLX_VENDOR_LIBRARY_NAME,iHD
